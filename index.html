<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#300b13">
  <meta name="description" content="정적인 질투에서 동적인 질투로, 작은 질투에서 큰 질투로. 클릭하면 현재 레터링이 고정됩니다.">
  <title>질투 — 가변 레터링</title>
  <style>
    :root { color-scheme: dark; --paper: #300b13; --ink: #ffe9e3; --lettering: #fcfcfc; --muted: #c59b9f; --line: #67363f; --track: #9b6972; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    .canvas { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; width: 100%; height: 100svh; min-height: 440px; padding: 28px 36px 24px; overflow: hidden; touch-action: none; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; z-index: 1; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.06em; }
    .caption { margin-left: 14px; color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: .13em; }
    .instruction { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; text-align: right; }
    .artwork { position: relative; display: grid; place-items: center; min-height: 0; outline: none; cursor: crosshair; }
    .artwork:focus-visible { outline: 1px solid var(--muted); outline-offset: -6px; }
    .canvas.is-frozen .artwork { cursor: pointer; }
    .canvas.is-frozen .instruction { color: var(--ink); }
    #lettering { display: block; width: 100%; height: 100%; max-width: 1120px; overflow: visible; fill: var(--lettering); }
    .axis { position: absolute; z-index: 1; color: var(--muted); font-size: 12px; letter-spacing: .04em; pointer-events: none; text-shadow: 0 0 6px var(--paper), 0 0 3px var(--paper); }
    .axis-top { top: 26px; left: 50%; transform: translateX(-50%); }
    .axis-bottom { bottom: 22px; left: 50%; transform: translateX(-50%); }
    .axis-left { left: 0; top: 50%; writing-mode: vertical-rl; }
    .axis-right { right: 0; top: 50%; writing-mode: vertical-rl; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 28px; border-top: 1px solid var(--line); padding-top: 18px; }
    .controls { display: flex; gap: 36px; }
    .control { display: grid; grid-template-columns: 1fr auto; gap: 10px 24px; width: 160px; }
    label { font-size: 14px; }
    output { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    input[type=range] { grid-column: 1 / -1; width: 100%; height: 16px; margin: 0; appearance: none; background: transparent; cursor: ew-resize; touch-action: none; }
    input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--track); }
    input[type=range]::-moz-range-track { height: 1px; background: var(--track); }
    input[type=range]::-webkit-slider-thumb { appearance: none; width: 7px; height: 7px; margin-top: -3px; background: var(--ink); border-radius: 50%; }
    input[type=range]::-moz-range-thumb { width: 7px; height: 7px; border: 0; background: var(--ink); border-radius: 50%; }
    input:focus-visible { outline: 1px solid var(--ink); outline-offset: 5px; }
    input:disabled { opacity: .45; cursor: not-allowed; }
    .position { display: flex; align-items: center; gap: 14px; }
    .coordinates { color: var(--muted); font: 12px/1.7 ui-monospace, monospace; font-variant-numeric: tabular-nums; text-align: right; }
    .map { position: relative; width: 48px; height: 48px; border: 1px solid var(--track); }
    .map::before, .map::after { content: ''; position: absolute; background: var(--line); }
    .map::before { width: 1px; height: 100%; left: 50%; }
    .map::after { height: 1px; width: 100%; top: 50%; }
    .map-dot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; background: var(--ink); border-radius: 50%; transform: translate(-50%, -50%); z-index: 1; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      .canvas { padding: 22px 20px 20px; }
      .caption { display: none; }
      .instruction { max-width: 220px; font-size: 12px; }
      .controls { gap: 24px; flex: 1; }
      .control { width: auto; flex: 1; gap: 10px; }
      footer { gap: 24px; }
      .coordinates { display: none; }
      .map { width: 38px; height: 38px; }
      .axis-left { left: -8px; }
      .axis-right { right: -8px; }
      #lettering { width: calc(100% - 16px); }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <main class="canvas">
    <header>
      <h1>질투<span class="caption">VARIABLE LETTERING</span></h1>
      <p class="instruction" role="status" aria-live="polite">움직여서 조절 · 클릭 / 탭으로 고정</p>
    </header>
    <div class="artwork" tabindex="0" role="button" aria-label="질투 레터링 고정" aria-pressed="false" aria-describedby="keyboard-help">
      <span class="axis axis-top" aria-hidden="true">작은 질투</span>
      <span class="axis axis-bottom" aria-hidden="true">큰 질투</span>
      <span class="axis axis-left" aria-hidden="true">정적인 질투</span>
      <span class="axis axis-right" aria-hidden="true">동적인 질투</span>
      <svg id="lettering" viewBox="0 100 1080 880" role="img" aria-labelledby="art-title art-description">
        <title id="art-title">질투</title>
        <desc id="art-description">왼쪽은 정적인 질투, 오른쪽은 동적인 질투. 위쪽은 작은 질투, 아래쪽은 큰 질투. 클릭하면 현재 형태가 고정되고 다시 클릭하면 움직입니다.</desc>
        <defs>
          <filter id="edge-glitch" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="-100" y="0" width="1280" height="1080" color-interpolation-filters="sRGB">
            <!-- Keep the solid interior intact; perturb only the thin boundary. -->
            <feMorphology in="SourceGraphic" operator="erode" radius="3" result="solid-core"/>
            <feTurbulence id="edge-noise" type="fractalNoise" baseFrequency="0.025 0.24" numOctaves="1" seed="7" result="edge-noise"/>
            <feDisplacementMap id="edge-displacement" in="SourceGraphic" in2="edge-noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="shifted-edge"/>
            <feMerge>
              <feMergeNode in="shifted-edge"/>
              <feMergeNode in="solid-core"/>
            </feMerge>
          </filter>
        </defs>
        <g transform="translate(540 540) scale(1.2) translate(-540 -540)">
          <g id="outlines"></g>
        </g>
      </svg>
    </div>
    <p id="keyboard-help" class="sr-only">방향키 좌우로 정적인 질투에서 동적인 질투로, 상하로 작은 질투에서 큰 질투로 조절합니다. Home 키는 가장 작고 정적인 형태, End 키는 가장 크고 동적인 형태입니다. Enter 또는 스페이스 키로 현재 형태를 고정하거나 해제합니다. 고정된 동안에는 슬라이더와 방향키 조절도 멈춥니다.</p>
    <footer>
      <div class="controls" data-controls>
        <div class="control">
          <label for="serif">동적인 정도</label><output id="serif-value" for="serif">50%</output>
          <input id="serif" type="range" min="0" max="100" value="50" step="1">
        </div>
        <div class="control">
          <label for="weight">질투의 크기</label><output id="weight-value" for="weight">50%</output>
          <input id="weight" type="range" min="0" max="100" value="50" step="1">
        </div>
      </div>
      <div class="position" aria-hidden="true">
        <span class="coordinates">X <span id="x-value">050</span><br>Y <span id="y-value">050</span></span>
        <div class="map"><span class="map-dot"></span></div>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      'use strict';
      const { outlines, masters } = JSON.parse(document.getElementById('lettering-data').textContent);
      const group = document.getElementById('outlines');
      const paths = outlines.map(() => {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        group.appendChild(path);
        return path;
      });
      // Shape-preserving cubic interpolation through 02 → 03 → 01. Shared
      // midpoint tangents keep the motion continuous without overshooting strokes.
      function spline(a, middle, b) {
        const first = middle - a, second = b - middle;
        const tangent = first * second > 0 ? 2 * first * second / (first + second) : 0;
        const limit = (slope, delta) => slope * delta <= 0 ? 0
          : Math.sign(delta) * Math.min(Math.abs(slope), 3 * Math.abs(delta));
        const start = limit((3 * first - second) / 2, first);
        const end = limit((3 * second - first) / 2, second);
        return [
          [a, start, 3 * first - 2 * start - tangent, -2 * first + start + tangent],
          [middle, tangent, 3 * second - 2 * tangent - end, -2 * second + tangent + end],
        ];
      }
      const curves = outlines.map(outline => outline.map(point =>
        Array.from({ length: 6 }, (_, axis) => spline(point[axis], point[axis + 6], point[axis + 12]))
      ));
      const serifInput = document.getElementById('serif');
      const weightInput = document.getElementById('weight');
      const serifValue = document.getElementById('serif-value');
      const weightValue = document.getElementById('weight-value');
      const xValue = document.getElementById('x-value');
      const yValue = document.getElementById('y-value');
      const dot = document.querySelector('.map-dot');
      const canvas = document.querySelector('.canvas');
      const artwork = document.querySelector('.artwork');
      const instruction = document.querySelector('.instruction');
      const edgeNoise = document.getElementById('edge-noise');
      const edgeDisplacement = document.getElementById('edge-displacement');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const current = { serif: .5, weight: .5 };
      const target = { ...current };
      let frame = 0;
      let previousTime = 0;
      let usingControls = false;
      let frozen = false;
      let touchStart = null;
      let touchDragged = false;
      let lastPointer = null;
      let edgeMotionUntil = 0;
      let edgeStrength = 0;
      let edgeFrame = -Infinity;
      let edgeFilterActive = false;
      const clamp = value => Math.max(0, Math.min(1, value));

      function clearEdgeEffect() {
        group.removeAttribute('filter');
        edgeDisplacement.setAttribute('scale', '0');
        edgeFilterActive = false;
        edgeMotionUntil = 0;
        edgeStrength = 0;
        edgeFrame = -Infinity;
        lastPointer = null;
      }

      function trackEdgeMotion(event) {
        if (event.type !== 'pointermove' || reducedMotion.matches) return;
        const now = performance.now();
        const previous = lastPointer;
        lastPointer = { x: event.clientX, y: event.clientY, time: now };
        if (!previous) return;
        const distance = Math.hypot(event.clientX - previous.x, event.clientY - previous.y);
        if (distance < .4) return;
        edgeStrength = clamp(distance / Math.max(8, now - previous.time) / 2);
        edgeMotionUntil = now + 110;
      }

      function updateEdgeEffect(time) {
        if (frozen || reducedMotion.matches || time >= edgeMotionUntil) {
          if (edgeFilterActive || edgeMotionUntil) clearEdgeEffect();
          return false;
        }
        if (!edgeFilterActive) {
          group.setAttribute('filter', 'url(#edge-glitch)');
          edgeFilterActive = true;
        }
        // Displacement is capped at ±2.3 SVG units, within the protected 3-unit rim.
        // A uniform fill stays uniform; only its silhouette gains a fine jitter.
        const fade = Math.min(1, (edgeMotionUntil - time) / 70);
        edgeDisplacement.setAttribute('scale', ((1.6 + edgeStrength * 2.4) * 1.15 * fade).toFixed(2));
        if (time - edgeFrame >= 75) {
          edgeFrame = time;
          edgeNoise.setAttribute('seed', String(1 + Math.floor(Math.random() * 997)));
        }
        return true;
      }

      function render(serif, weight) {
        // The three diagonal reference states retain the supplied SVG curves.
        // Vertical movement adjusts weight independently of the serif progression.
        const original = serif === 0 && weight === 0 ? masters['light-sans']
          : serif === .5 && weight === .5 ? masters.medium
          : serif === 1 && weight === 1 ? masters['bold-serif'] : null;
        if (original) {
          paths.forEach((path, i) => path.setAttribute('d', original[i] || ''));
        } else {
          const segment = serif < .5 ? 0 : 1;
          const t = serif * 2 - segment;
          const amount = Math.abs(weight - serif);
          const offset = weight >= serif ? 2 : 4;
          const evaluate = curve => {
            const [a, b, c, d] = curve[segment];
            return ((d * t + c) * t + b) * t + a;
          };
          curves.forEach((outline, i) => {
            const d = outline.map((point, j) => {
              const x = evaluate(point[0]) + evaluate(point[offset]) * amount;
              const y = evaluate(point[1]) + evaluate(point[offset + 1]) * amount;
              return `${j ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`;
            }).join('') + 'Z';
            paths[i].setAttribute('d', d);
          });
        }
        const s = Math.round(serif * 100), w = Math.round(weight * 100);
        serifValue.value = `${s}%`;
        weightValue.value = `${w}%`;
        xValue.textContent = String(s).padStart(3, '0');
        yValue.textContent = String(w).padStart(3, '0');
        dot.style.left = `${serif * 100}%`;
        dot.style.top = `${weight * 100}%`;
      }

      function tick(time) {
        if (frozen) { frame = 0; previousTime = 0; return; }
        const elapsed = previousTime ? Math.min(time - previousTime, 64) : 16;
        previousTime = time;
        const ease = reducedMotion.matches ? 1 : 1 - Math.exp(-elapsed / 65);
        for (const axis of ['serif', 'weight']) {
          current[axis] += (target[axis] - current[axis]) * ease;
          if (Math.abs(target[axis] - current[axis]) < .0003) current[axis] = target[axis];
        }
        render(current.serif, current.weight);
        const edgeActive = updateEdgeEffect(time);
        if (current.serif !== target.serif || current.weight !== target.weight || edgeActive) frame = requestAnimationFrame(tick);
        else { frame = 0; previousTime = 0; }
      }

      function setTarget(serif, weight) {
        if (frozen) return;
        target.serif = clamp(serif);
        target.weight = clamp(weight);
        serifInput.value = Math.round(target.serif * 100);
        weightInput.value = Math.round(target.weight * 100);
        if (!frame) frame = requestAnimationFrame(tick);
      }

      function move(event) {
        if (touchStart && event.pointerType === 'touch'
          && Math.hypot(event.clientX - touchStart.x, event.clientY - touchStart.y) > 8) touchDragged = true;
        if (frozen || usingControls || event.target.closest('[data-controls]')) return;
        if (event.pointerType === 'touch' && event.type === 'pointermove' && !event.buttons) return;
        trackEdgeMotion(event);
        // A small edge margin makes the two exact reference designs easy to reach.
        const margin = 20;
        setTarget((event.clientX - margin) / Math.max(1, innerWidth - margin * 2),
          (event.clientY - margin) / Math.max(1, innerHeight - margin * 2));
      }
      function toggleFrozen() {
        frozen = !frozen;
        clearEdgeEffect();
        if (frozen) {
          // Stop at the visible frame, including when easing is still in progress.
          cancelAnimationFrame(frame);
          frame = 0;
          previousTime = 0;
          Object.assign(target, current);
          serifInput.value = Math.round(current.serif * 100);
          weightInput.value = Math.round(current.weight * 100);
        }
        serifInput.disabled = frozen;
        weightInput.disabled = frozen;
        canvas.classList.toggle('is-frozen', frozen);
        artwork.setAttribute('aria-pressed', String(frozen));
        artwork.setAttribute('aria-label', frozen ? '질투 레터링 고정 해제' : '질투 레터링 고정');
        instruction.textContent = frozen ? '고정됨 · 다시 클릭 / 탭하면 해제' : '움직여서 조절 · 클릭 / 탭으로 고정';
      }
      window.addEventListener('pointermove', move, { passive: true });
      window.addEventListener('blur', clearEdgeEffect);
      document.documentElement.addEventListener('pointerleave', clearEdgeEffect);
      reducedMotion.addEventListener('change', clearEdgeEffect);
      window.addEventListener('pointerdown', event => {
        touchDragged = false;
        touchStart = event.pointerType === 'touch' ? { x: event.clientX, y: event.clientY } : null;
      }, { passive: true });
      canvas.addEventListener('click', event => {
        if (event.button !== 0 || event.target.closest('[data-controls]')) return;
        if (touchDragged) { touchDragged = false; return; }
        toggleFrozen();
        if (!frozen && event.detail > 0) move(event);
      });
      document.querySelector('[data-controls]').addEventListener('pointerdown', () => { usingControls = true; });
      window.addEventListener('pointerup', () => { usingControls = false; touchStart = null; });
      window.addEventListener('pointercancel', () => { usingControls = false; touchStart = null; touchDragged = false; });
      serifInput.addEventListener('input', () => setTarget(Number(serifInput.value) / 100, target.weight));
      weightInput.addEventListener('input', () => setTarget(target.serif, Number(weightInput.value) / 100));
      artwork.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          if (!event.repeat) toggleFrozen();
          return;
        }
        if (frozen) {
          if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(event.key)) event.preventDefault();
          return;
        }
        const step = event.shiftKey ? .1 : .02;
        const changes = {
          ArrowLeft: [target.serif - step, target.weight],
          ArrowRight: [target.serif + step, target.weight],
          ArrowUp: [target.serif, target.weight - step],
          ArrowDown: [target.serif, target.weight + step],
          Home: [0, 0], End: [1, 1],
        };
        if (changes[event.key]) { event.preventDefault(); setTarget(...changes[event.key]); }
      });
      render(current.serif, current.weight);
    })();
  </script>
</body>
</html>
